# Dieser Name wird in der GitHub-Oberfläche unter "Actions" angezeigt.
name: Starter CI

# "on" legt fest, welches Ereignis den Workflow startet.
on:
  push:
    # Der Workflow läuft nur bei Änderungen, die auf "main" gepusht werden.
    branches: [ main ]
  pull_request:
    # So wird auch jeder vorgeschlagene Beitrag vor dem Zusammenführen geprüft.
    branches: [ main ]

# Der Workflow muss den Repository-Inhalt nur lesen und erhält keine Schreibrechte.
permissions:
  contents: read

# Unter "jobs" stehen die Aufgaben, die der Workflow ausführt.
jobs:
  # "build" ist die frei wählbare, interne ID dieses Jobs.
  build:
    # GitHub stellt für den Job eine aktuelle Ubuntu-VM bereit.
    runs-on: ubuntu-latest
    steps:
      # Lädt den Inhalt dieses Repositorys auf die VM.
      - uses: actions/checkout@v4
      - name: Display runner details
        # "run" führt einen Shell-Befehl aus. runner.os ist eine GitHub-Kontextvariable.
        run: echo "Workflow is running on ${{ runner.os }}"
