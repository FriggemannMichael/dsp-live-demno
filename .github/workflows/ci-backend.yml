# Dieser Workflow zeigt dieselbe CI-Idee wie ci-frontend.yml, nur für ein Python-Backend.
name: Backend CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      # pytest sucht automatisch nach Testdateien und führt sie aus.
      - name: Tests ausführen
        run: pytest
