# This workflow doesn't do anything serious - it walks once through the
# repository and is the first workflow worth trying out
name: Repo Tour

on:
  workflow_dispatch:

jobs:
  tour:
    name: Walk through the repo
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Print header
        run: |
          echo "======================================"
          echo "   Welcome to the gh-actions-repo tour"
          echo "======================================"
          echo "Runner OS: ${{ runner.os }}"
          echo "Repository: ${{ github.repository }}"

      - name: Count and list runnable workflows
        run: |
          echo
          echo "-- Actually runs (.github/workflows/) --"
          find .github/workflows -maxdepth 1 -name "*.yml" | sort
          count=$(find .github/workflows -maxdepth 1 -name "*.yml" | wc -l)
          echo "Total: $count workflows"

      - name: Browse reference categories
        run: |
          echo
          echo "-- Reference only (examples/) --"
          for dir in examples/*/; do
            category=$(basename "$dir")
            echo "$category:"
            find "$dir" -name "*.yml" -printf "  - %f\n" | sort
          done

      - name: Tip of the day
        run: |
          echo
          tips=(
            "A job without 'needs' starts immediately and in parallel with other jobs."
            "workflow_dispatch makes a workflow manually triggerable - handy for testing."
            "Secrets never live in the code, only in the repository settings."
            "concurrency with cancel-in-progress prevents duplicate, overlapping runs."
            "Marketplace actions can be pinned to a commit hash instead of a tag."
            "permissions: contents: read gives the GITHUB_TOKEN read-only access."
          )
          echo "Tip of the day: ${tips[$RANDOM % ${#tips[@]}]}"
