name: Report a bug
description: Report an issue in a workflow, example, or explanatory text.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your report. Please don't publish any credentials or other secrets here.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Runnable workflow under .github/workflows
        - Reference example under examples
        - README or other documentation
        - Other area
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: File or example
      description: In which file is the bug found?
      placeholder: examples/deploy/ftp.yml
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug and, if possible, the steps to reproduce it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What would be correct or clearer?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional – for example error messages, links, or screenshots without sensitive data.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that no matching issue already exists for this.
          required: true
        - label: This report contains no secrets or private credentials.
          required: true
        - label: I will follow this project's Code of Conduct.
          required: true
