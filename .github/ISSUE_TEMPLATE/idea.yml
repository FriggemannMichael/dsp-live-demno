name: Idea or new example
description: Suggest an improvement, explanation, or new learning example.
title: "[Idea]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea. Good suggestions explain a concrete learning goal and stay as small as possible.

  - type: textarea
    id: idea
    attributes:
      label: What are you proposing?
      description: Describe the desired change in simple terms.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: What can beginners learn from this?
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Do you want to work on this yourself?
      options:
        - Yes, after a short discussion
        - Maybe, I need support
        - No, just a suggestion
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Examples or further links
      description: Optional – link official documentation or similar examples.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that no matching issue already exists for this.
          required: true
        - label: I will follow this project's Code of Conduct.
          required: true
