# This workflow shows the same CI idea as ci-frontend.yml, just for a Python backend.
name: Backend CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest automatically discovers and runs test files.
      - name: Run tests
        run: pytest
