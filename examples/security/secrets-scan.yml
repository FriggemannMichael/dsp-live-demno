# This workflow scans the repository for accidentally committed
# credentials (secrets). It runs manually, on every push to main, and
# additionally on a weekly "schedule" (cron), so that older, unchanged
# commits are also checked again periodically.
name: Secrets Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Minute hour day month weekday - here: every Monday at midnight (UTC).
    - cron: "0 0 * * 1"

# "permissions" restricts what the automatic GITHUB_TOKEN is allowed to
# do. Read access to the code is enough for a pure scan.
permissions:
  contents: read

jobs:
  scan:
    name: Search for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Instead of a tag (e.g. @v3), marketplace actions can also be
      # pinned to their immutable commit hash. This prevents a tag that's
      # later tampered with from silently running different code.
      - name: Search for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@afbf580a6ec37188c43b2f3f66b9169484206a2f # v3.88.27
        with:
          path: ./
