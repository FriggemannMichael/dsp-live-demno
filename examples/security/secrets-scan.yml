# Dieser Workflow durchsucht das Repository nach versehentlich eingecheckten
# Zugangsdaten (Secrets). Er läuft manuell, bei jedem Push auf main und
# zusätzlich wöchentlich per "schedule" (Cron), damit auch ältere,
# unveränderte Commits regelmäßig erneut geprüft werden.
name: Secrets Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Minute Stunde Tag Monat Wochentag - hier: jeden Montag um Mitternacht (UTC).
    - cron: "0 0 * * 1"

# "permissions" schränkt ein, wozu der automatische GITHUB_TOKEN berechtigt
# ist. Für einen reinen Scan reicht Lesezugriff auf den Code.
permissions:
  contents: read

jobs:
  scan:
    name: Nach Secrets suchen
    runs-on: ubuntu-latest
    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Marketplace-Actions lassen sich statt mit einem Tag (z.B. @v3) auch
      # mit dem unveränderlichen Commit-Hash pinnen. Das verhindert, dass ein
      # nachträglich manipulierter Tag unbemerkt anderen Code ausführt.
      - name: Secrets suchen (TruffleHog)
        uses: trufflesecurity/trufflehog@afbf580a6ec37188c43b2f3f66b9169484206a2f # v3.88.27
        with:
          path: ./
