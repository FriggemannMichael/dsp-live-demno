# Dependency Audit (Software Composition Analysis / SCA) checks a
# project's dependencies for known security vulnerabilities. It
# complements ci-frontend.yml and ci-backend.yml with a security check
# and assumes the same project structure.
name: Dependency Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-frontend:
    name: Check Node.js dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # "audit-level=high" only fails the job for severe/critical vulnerabilities.
      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high

  audit-backend:
    name: Check Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Check for known vulnerabilities
        run: pip-audit -r requirements.txt
