# SAST (Static Application Security Testing) scans a project's own
# source code for insecure patterns - unlike the Dependency Audit, which
# checks third-party code (dependencies).
name: SAST Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: Check code for insecure patterns
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      # "p/security-audit" is a Semgrep-maintained, language-agnostic
      # rule set for general security issues.
      - name: Run Semgrep scan
        run: semgrep scan --config p/security-audit --error
