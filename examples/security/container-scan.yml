# This workflow builds a Docker image and scans it for known
# vulnerabilities in its packages before it would be used in a deploy
# workflow. Assumes a Dockerfile exists in the project.
name: Container Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Scan image with Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t demo-app:${{ github.sha }} .

      # "--severity HIGH,CRITICAL" filters out low-priority findings,
      # "--exit-code 1" fails the job if anything is found.
      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            demo-app:${{ github.sha }}
