# This workflow shows a real deployment: uploading a static website via FTP.
name: FTP Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Server, username, and password are stored as GitHub secrets in the
      # repository (Settings → Secrets and variables → Actions) and never
      # live in the code.
      - name: Upload via FTP
        # "SamKirkland" is the developer's GitHub username and
        # "FTP-Deploy-Action" the name of their ready-made building block
        # for FTP uploads. GitHub pulls version v4.3.5 and runs it for this step.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /htdocs/
