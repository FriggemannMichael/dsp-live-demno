# This workflow shows a two-stage flow: build/test first, then deployment.
# Splitting it into two jobs ensures a failed build/test never even starts
# the deploy job (see "needs" below).
name: Angular Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Create production build
        run: npm run build -- --configuration production

      # The build is passed on as an artifact because the deploy job
      # starts on a fresh, empty VM and has no access to this job.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Host, username, and SSH key are stored as GitHub secrets so no
      # credentials live in the code.
      - name: Copy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/my-app"
