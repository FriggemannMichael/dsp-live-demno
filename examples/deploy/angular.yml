# Dieser Workflow zeigt einen zweistufigen Ablauf: erst Build/Test, dann Deployment.
# Die Trennung in zwei Jobs sorgt dafür, dass ein fehlgeschlagener Build/Test
# den Deploy-Job gar nicht erst startet (siehe "needs" unten).
name: Angular Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Tests ausführen
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Produktions-Build erstellen
        run: npm run build -- --configuration production

      # Der Build wird als Artifact weitergereicht, weil der Deploy-Job
      # auf einer neuen, leeren VM startet und keinen Zugriff auf diesen Job hat.
      - name: Build hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Build herunterladen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Host, Benutzername und SSH-Key liegen als GitHub Secrets vor,
      # damit keine Zugangsdaten im Code stehen.
      - name: Per SSH auf Server kopieren
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/meine-app"
