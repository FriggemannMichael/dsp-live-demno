# This name is shown in the GitHub UI under "Actions".
name: Manual Run Demo

# "on" defines which event triggers the workflow.
on:
  # Shows the "Run workflow" button in GitHub Actions for a manual start.
  workflow_dispatch:
    # These input fields are shown before the manual start.
    inputs:
      # "environments" is the ID of the input field and can be reused below.
      environments:
        # This help text is shown in the GitHub UI.
        description: Target environment
        # The workflow can't be started without a value.
        required: true
        # This value is preselected and can be changed at start.
        default: staging

# "jobs" holds the tasks the workflow runs.
jobs:
  # "deploy" is the freely chosen, internal ID of this job.
  deploy:
    # GitHub provides a current Ubuntu VM for the job.
    runs-on: ubuntu-latest
    steps:
      # ${{ ... }} is an expression. Here it inserts the previously entered value.
      # The command only demonstrates the input and doesn't perform a real deployment yet.
      - run: echo "Deploying to ${{ github.event.inputs.environments }}"
