# This workflow shows the "pull_request" trigger: it doesn't run on every
# push, only when a pull request against the given branch is opened or
# updated.
name: Pull Request Demo

on:
  pull_request:
    branches: [main]

jobs:
  show-pr-info:
    name: Show PR info
    runs-on: ubuntu-latest
    steps:
      # github.event.pull_request contains details about the pull request.
      # github.head_ref/base_ref are also available for pull_request events.
      - name: Print context
        run: |
          echo "Pull Request #${{ github.event.pull_request.number }}"
          echo "From branch: ${{ github.head_ref }}"
          echo "To branch: ${{ github.base_ref }}"
