# Dieser Workflow zeigt, wie "concurrency" verhindert, dass mehrere Läufe
# gleichzeitig aktiv sind. Wird er ein zweites Mal gestartet, während der
# erste Lauf noch aktiv ist, bricht "cancel-in-progress" den ersten Lauf ab.
name: Concurrency Demo

on:
  workflow_dispatch:

# Alle Läufe mit derselben "group" teilen sich diese Regel.
concurrency:
  group: concurrency-demo
  cancel-in-progress: true

jobs:
  simulate-long-task:
    name: Langen Task simulieren
    runs-on: ubuntu-latest
    steps:
      # Zum Ausprobieren: Diesen Workflow zweimal kurz hintereinander manuell
      # starten. Der erste Lauf wird abgebrochen, sobald der zweite startet.
      - name: Warten und Ausgabe
        run: |
          echo "Task gestartet..."
          sleep 30
          echo "Task abgeschlossen."
