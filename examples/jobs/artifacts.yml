# This workflow shows how a file is transferred between two jobs.
name: Artifacts Demo

on:
  workflow_dispatch:

jobs:
  create-artifact:
    name: Create file
    runs-on: ubuntu-latest
    steps:
      - name: Generate sample file
        run: |
          mkdir -p demo-output
          echo "This file was created by the first job." > demo-output/message.txt

      # An artifact keeps files around even after this job ends.
      - name: Upload file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-message
          path: demo-output/message.txt

  read-artifact:
    name: Read file
    needs: create-artifact
    runs-on: ubuntu-latest
    steps:
      # The second job runs on a fresh VM, so it downloads the file again.
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-message
          path: downloaded

      - name: Show content
        run: cat downloaded/message.txt
