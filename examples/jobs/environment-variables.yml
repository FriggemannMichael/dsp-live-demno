# This workflow shows variables at the workflow, job, and step level.
name: Environment Variables Demo

# The workflow is triggered manually and doesn't change any files in the repository.
on:
  workflow_dispatch:

# This variable is available in all jobs and steps of this workflow.
env:
  APP_NAME: actions-beginner-demo

jobs:
  show-variables:
    name: Show variables
    runs-on: ubuntu-latest

    # This variable only applies within the "show-variables" job.
    env:
      TARGET_ENVIRONMENT: training

    steps:
      - name: Print variables
        # This variable is only available in this single step.
        env:
          GREETING: Hello
        # On an Ubuntu runner, environment variables are read with $NAME.
        run: |
          echo "$GREETING!"
          echo "Application: $APP_NAME"
          echo "Target environment: $TARGET_ENVIRONMENT"
