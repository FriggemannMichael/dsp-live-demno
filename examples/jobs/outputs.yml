# This workflow shows how a job passes a small value to another job.
name: Job Outputs Demo

on:
  workflow_dispatch:

jobs:
  create-message:
    name: Create message
    runs-on: ubuntu-latest

    # A job output exposes the step output to other jobs.
    outputs:
      greeting: ${{ steps.create-output.outputs.greeting }}

    steps:
      - name: Generate output
        # This ID is used to reference the step output above.
        id: create-output
        # GITHUB_OUTPUT is a file provided by GitHub for step outputs.
        run: echo "greeting=Hello from the first job" >> "$GITHUB_OUTPUT"

  show-message:
    name: Use message
    # "needs" makes this job wait and gives it access to that job's outputs.
    needs: create-message
    runs-on: ubuntu-latest
    steps:
      - name: Print first job's output
        run: |
          echo "Received: ${{ needs.create-message.outputs.greeting }}"
