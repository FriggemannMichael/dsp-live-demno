# This workflow shows how multiple jobs run before a shared follow-up job.
name: Job Dependencies Demo

# The workflow is deliberately triggered manually so it can be tried independently.
on:
  workflow_dispatch:

jobs:
  # "build" and "test" have no "needs" and can therefore start in parallel.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Simulate build
        run: echo "Build completed"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Simulate tests
        run: echo "Tests completed"

  deploy:
    name: Deploy
    # This job waits until both "build" and "test" have succeeded.
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      # The deployment is only simulated with an output for this demo.
      - name: Simulate deployment
        run: echo "Deploy starts after build and test"
