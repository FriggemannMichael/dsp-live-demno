# This workflow shows how a "services" container is provided for the
# duration of a job - here a Postgres database, as needed by real tests
# that run against a database.
name: Service Container Demo

on:
  workflow_dispatch:

jobs:
  test-with-database:
    name: Test with database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo
        ports: ["5432:5432"]
        # health-cmd makes the job wait until the database is ready.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # localhost works because the service container port is mapped to
      # the runner itself (see "ports" above).
      - name: Check database connection
        run: PGPASSWORD=demo psql -h localhost -U demo -d demo -c "SELECT 1;"
