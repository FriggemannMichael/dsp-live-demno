# This workflow shows a fixed order of classic pipeline stages.
name: Ordered Pipeline Demo

# The workflow is deliberately triggered manually so it can be tried independently.
on:
  workflow_dispatch:

jobs:
  # The first job has no dependency and starts immediately.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Simulate code check
        run: echo "Lint completed"

  build:
    name: Build
    # "needs" refers to the job ID and makes this job wait for "lint".
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Simulate build
        run: echo "Build completed"

  test:
    name: Test
    # The test only starts once the build has succeeded.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Simulate tests
        run: echo "Tests completed"

  deploy:
    name: Deploy
    # The deployment forms the end of the chain and waits for the test.
    needs: test
    runs-on: ubuntu-latest
    steps:
      # The deployment is only simulated with an output for this demo.
      - name: Simulate deployment
        run: echo "Deploy completed"
